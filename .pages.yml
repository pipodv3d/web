media:
  - name: fotos-piezas
    label: Fotos de piezas
    input: imagenes/piezas
    output: imagenes/piezas
    extensions: [jpg, jpeg, png, webp]
  - name: fotos-eventos
    label: Fotos de eventos
    input: imagenes/eventos
    output: imagenes/eventos
    extensions: [jpg, jpeg, png, webp]

content:
  - name: catalogo
    label: Catálogo de piezas
    type: file
    path: catalogo.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificador interno
        type: uuid
        required: true
        readonly: true
        options:
          editable: false
      - name: nombre
        label: Nombre de la pieza
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values:
            - Anime/Cómic
            - Videojuegos
            - Cine/TV
            - Láminas
            - Llaveros
            - Puntos de libro
            - Decoración
            - Navidad
            - Halloween
            - Otros
            - Personalizaciones
      - name: descripcion
        label: Descripción
        type: text
        required: true
      - name: precioOrientativo
        label: Precio orientativo
        type: string
        description: Por ejemplo, Desde 8 € o A consultar.
      - name: medidas
        label: Medidas
        type: string
      - name: disponibilidad
        label: Disponibilidad
        type: string
        description: Por ejemplo, Disponible, Bajo consulta o Agotado temporalmente.
      - name: imagenes
        label: Fotografías de la pieza
        type: image
        required: true
        options:
          media: fotos-piezas
          multiple:
            max: 8
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: makerworld
        label: Enlace de descarga en MakerWorld
        type: string
        description: Déjalo vacío si no es un diseño propio publicado para descargar.
  - name: eventos
    label: Próximos eventos
    type: file
    path: eventos.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del evento
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: string
        required: true
        description: Puedes escribir una fecha o un intervalo, por ejemplo, 12 y 13 de diciembre de 2026.
      - name: lugar
        label: Lugar
        type: string
        required: true
      - name: imagen
        label: Imagen del evento
        type: image
        required: true
        options:
          media: fotos-eventos
          extensions: [jpg, jpeg, png, webp]
          rename: safe
